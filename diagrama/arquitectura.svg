<polyline points="1220,340 1220,485 150,485" fill="none" stroke="#355d79" stroke-width="2.6"  marker-end="url(#arr)"/>
<polyline points="150,485 150,800 960,800 960,720" fill="none" stroke="#355d79" stroke-width="2.6"  marker-end="url(#arr)"/>
