<!doctype html><meta charset="utf-8"><title>Evidencias del laboratorio de seguridad</title>
<style>body{font:17px system-ui;margin:0;background:#f4f6f8;color:#182631}main{max-width:1120px;margin:28px auto;padding:0 28px}h1{font-size:30px;margin:8px 0}h2{font-size:21px;margin-top:26px}.meta{color:#536675;font-size:14px}pre{background:white;border:1px solid #cbd5dd;padding:18px;font:14px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;background:white;font-size:15px}td,th{padding:10px;text-align:left;border:1px solid #cbd5dd}th{background:#203948;color:white}.note{font-size:16px;line-height:1.5}.pass{color:#12653b;font-weight:700}.fail{color:#a13b23;font-weight:700}a{color:#254e72}</style>
<main><div class="meta">ACTIVIDAD 3 · LOCALSTACK · DOCKER COMPOSE · TERRAFORM</div><h1 id="title"></h1><p class="meta" id="date"></p><div id="out"></div><p class="meta">Visor local de archivos de evidencia generados por herramientas reales. Captura del navegador.</p></main>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;');const read=p=>fetch(p).then(r=>r.json());const pre=s=>'<pre>'+esc(typeof s==='string'?s:JSON.stringify(s,null,2))+'</pre>';
(async()=>{const phase=new URLSearchParams(location.search).get('fase')||'1';let html='';
if(phase==='1'){const j=await read('s3-validation.json');$('#title').textContent='Fase 1 · Terraform y bucket S3 local';$('#date').textContent=j.fecha_utc+' · Endpoint '+j.endpoint;const log=await fetch('terraform-apply.log').then(r=>r.text());html+='<h2>Despliegue ejecutado</h2>'+pre(log.slice(log.indexOf('Apply complete!')));html+='<h2>Controles recuperados desde LocalStack</h2>'+pre({PublicAccessBlock:j.public_access_block.PublicAccessBlockConfiguration,Cifrado:j.encryption.ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault,Objeto:j.head_object.ServerSideEncryption,Propiedad:j.ownership.OwnershipControls.Rules[0]});html+='<p class="note fail">Hallazgo: GetBucketPolicyStatus no está implementado en esta edición. La lectura anónima devolvió HTTP '+j.anonymous_get_http+'. La configuración está aplicada; el aislamiento IAM equivalente a AWS no quedó demostrado.</p>';}
if(phase==='2'){const j=await read('trivy-summary.json');$('#title').textContent='Fase 2 · Análisis y mitigación con Trivy';$('#date').textContent=j.fecha_utc+' · '+j.arquitectura;html='<table><tr><th>Imagen</th><th>Críticas</th><th>Altas</th><th>Medias</th><th>Bajas</th><th>Sin clasificar</th><th>Total</th></tr>';for(const r of j.resultados)html+='<tr><td>'+esc(r.imagen)+'</td>'+['CRITICAL','HIGH','MEDIUM','LOW','UNKNOWN','total'].map(k=>'<td>'+r[k]+'</td>').join('')+'</tr>';html+='</table><p class="note">Conteo de ocurrencias vulnerabilidad-paquete, no CVE únicos. Misma arquitectura y base de Trivy. Cambiar solo la etiqueta node:14 por node:18 no redujo los hallazgos. La variante Node 18 corregida quedó sin críticas.</p><h2>Dockerfile final ejecutado</h2>'+pre('FROM node:24-alpine\nRUN npm ci --omit=dev && npm cache clean --force \\\n    && apk upgrade --no-cache zlib \\\n    && rm -rf /usr/local/lib/node_modules/npm /usr/local/bin/npm /usr/local/bin/npx\nUSER node\nCMD ["node", "server.js"]')+'<p class="note pass">Imagen final: 0 vulnerabilidades detectadas. El resultado corresponde a esta fecha y al alcance del escáner.</p>';}
if(phase==='3'){const j=await read('api-tests.json');$('#title').textContent='Fase 3 · Autenticación y autorización JWT';$('#date').textContent=j.fecha_utc+' · '+j.transporte;html='<p class="pass">'+j.correctas+' de '+j.total+' pruebas aprobadas</p><table><tr><th>Prueba</th><th>Esperado</th><th>Obtenido</th><th>Resultado</th></tr>';for(const r of j.pruebas)html+='<tr><td>'+esc(r.caso)+'</td><td>'+r.esperado+'</td><td>'+r.obtenido+'</td><td class="pass">'+r.resultado+'</td></tr>';html+='</table><p class="note">Firma HS256, expiración, issuer, audience y rol admin verificados. Las claves y los tokens no se muestran en estas evidencias.</p>';}
if(phase==='4'){const j=await read('zap-summary.json');$('#title').textContent='Fase 3 · Escaneo activo con OWASP ZAP';$('#date').textContent=j.fecha_utc+' · ZAP '+j.version+' · '+j.target;html='<h2>Resumen del escáner</h2>'+pre({progreso_activo:j.active_progress+'%',alertas:j.alerts,por_riesgo:j.risk_counts,reglas:j.rules})+'<h2>Rutas observadas</h2>'+pre(j.urls)+'<p class="note">Escaneo autenticado con política API Minimal y pruebas explícitas de permisos a través del proxy. La ausencia de alertas no garantiza ausencia de vulnerabilidades.</p>';}
if(phase==='5'){const j=await read('iam-validation.json');$('#title').textContent='Criterio 4 · Política IAM restringida por rol';$('#date').textContent=j.fecha_utc;html='<h2>Política aplicada al rol</h2>'+pre({Rol:j.role_arn,Politica:j.inline_policy})+'<h2>Ejemplo ejecutado con STS AssumeRole</h2>'+pre({Identidad:j.assumed_identity,GetObject:j.get_object_http,Bytes:j.object_bytes,Prueba_negativa_PutObject:j.put_object_http})+'<p class="note fail">La política solo autoriza s3:GetObject sobre evidencia.txt. LocalStack Community también permitió PutObject: el enforcement efectivo sigue pendiente.</p>';}
$('#out').innerHTML=html;})();
</script>
