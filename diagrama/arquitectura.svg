<rect x="30" y="335" width="240" height="150" rx="9" fill="white" stroke="#355d79" stroke-width="2"/>
<text x="150.0" y="367" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172d3d" text-anchor="middle">Cliente de pruebas</text>
<text x="150.0" y="396" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">CLI y cliente HTTP</text>
<text x="150.0" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">Sin credenciales reales</text>
<rect x="365" y="210" width="245" height="130" rx="9" fill="white" stroke="#355d79" stroke-width="2"/>
<text x="487.5" y="242" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172d3d" text-anchor="middle">POST /auth/login</text>
<text x="487.5" y="271" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">Credenciales simuladas</text>
<text x="487.5" y="300" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">Emite JWT de 15 minutos</text>
<rect x="685" y="210" width="280" height="130" rx="9" fill="white" stroke="#355d79" stroke-width="2"/>
<text x="825.0" y="242" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172d3d" text-anchor="middle">Middleware JWT</text>
<text x="825.0" y="271" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">HS256, exp, iss y aud</text>
<text x="825.0" y="300" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">Rechaza token inválido 401</text>
<rect x="1045" y="210" width="355" height="130" rx="9" fill="white" stroke="#355d79" stroke-width="2"/>
<text x="1222.5" y="242" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172d3d" text-anchor="middle">Endpoints sensibles</text>
<text x="1222.5" y="271" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">/api/profile → JWT válido</text>
<text x="1222.5" y="300" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">/api/admin → rol admin o 403</text>
<rect x="360" y="570" width="270" height="155" rx="9" fill="white" stroke="#355d79" stroke-width="2"/>
<text x="495.0" y="602" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172d3d" text-anchor="middle">Contenedor Terraform</text>
<text x="495.0" y="631" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">Proveedor AWS con endpoint local</text>
<text x="495.0" y="660" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">AES256, bloqueo público e IAM</text>
<rect x="845" y="575" width="255" height="145" rx="9" fill="white" stroke="#355d79" stroke-width="2"/>
<text x="972.5" y="607" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172d3d" text-anchor="middle">IAM y STS en LocalStack</text>
<text x="972.5" y="636" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">Rol Actividad3LecturaS3</text>
<text x="972.5" y="665" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">Credenciales temporales</text>
<rect x="1170" y="575" width="260" height="145" rx="9" fill="white" stroke="#355d79" stroke-width="2"/>
<text x="1300.0" y="607" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172d3d" text-anchor="middle">S3 en LocalStack</text>
<text x="1300.0" y="636" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">actividad3-seguro-2024</text>
<text x="1300.0" y="665" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">evidencia.txt · AES256</text>
<text x="305" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#172d3d" text-anchor="middle">1 Login</text>
<text x="300" y="141" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#172d3d" text-anchor="middle">2 JWT al cliente</text>
<text x="540" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#172d3d" text-anchor="middle">3 Authorization Bearer JWT</text>
<text x="1005" y="263" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#172d3d" text-anchor="middle">4</text>
<text x="690" y="477" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#172d3d" text-anchor="middle">5 Respuesta HTTP</text>
<text x="510" y="790" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#172d3d" text-anchor="middle">6 CLI asume rol con STS</text>
<text x="1136" y="632" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#172d3d" text-anchor="middle">7</text>
<text x="730" y="592" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#172d3d" text-anchor="middle">IaC</text>
<text x="900" y="855" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#172d3d" text-anchor="middle">IaC crea bucket y controles</text>
<text x="770" y="942" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#172d3d" text-anchor="middle">Línea continua: datos y peticiones. Línea punteada: configuración declarada con Terraform.</text>
<text x="770" y="974" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">La API y S3 se prueban por separado; no se implementó una conexión de aplicación entre ambos.</text>
<text x="770" y="1010" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#9b3627" text-anchor="middle">Pendiente: enforcement IAM en Community. Lectura anónima y escritura del rol devolvieron HTTP 200.</text>
</svg>