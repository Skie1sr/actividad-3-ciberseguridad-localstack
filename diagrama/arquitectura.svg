<rect width="1540" height="1060" fill="white"/>
<text x="770" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#172d3d" text-anchor="middle">Arquitectura del laboratorio de seguridad con LocalStack</text>
<text x="770" y="78" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#172d3d" text-anchor="middle">Flujos realmente probados · Docker Compose · Actividad 3</text>
<rect x="325" y="115" width="1175" height="790" rx="15" fill="#f7f9fb" stroke="#8a9ca9" stroke-width="2" stroke-dasharray="8 5"/>
<text x="900" y="140" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#172d3d" text-anchor="middle">Red Docker Compose · Puertos publicados solo en 127.0.0.1</text>
<rect x="345" y="175" width="1105" height="205" rx="12" fill="#e9f3f8" stroke="#9bb6c7"/>
<text x="900" y="198" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172d3d" text-anchor="middle">Contenedor API Express · Node 24 Alpine · Usuario node</text>
<rect x="805" y="520" width="650" height="255" rx="12" fill="#eef5f0" stroke="#8aac96"/>
<text x="1130" y="550" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172d3d" text-anchor="middle">Contenedor LocalStack Community 4.14.0</text>
